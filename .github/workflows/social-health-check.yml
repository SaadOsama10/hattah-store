name: Social — system health check (read-only)

# Validates the Meta token (debug_token, no value printed), Page/IG ids and a tiny OpenAI call.
# Publishes nothing.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
    steps:
      - name: Meta token
        run: |
          set +x
          G="https://graph.facebook.com/${META_GRAPH_VERSION}"
          curl -sS -G "$G/debug_token" --data-urlencode "input_token=${META_ACCESS_TOKEN}" --data-urlencode "access_token=${META_ACCESS_TOKEN}" \
            | jq '.data // . | {type, is_valid, expires_at, data_access_expires_at, app_id, scopes, error}'
          echo "Page:"; curl -sS -G "$G/${META_PAGE_ID}" --data-urlencode "fields=name,is_published" --data-urlencode "access_token=${META_ACCESS_TOKEN}" | jq -c 'del(.id)'
          echo "IG:"; curl -sS -G "$G/${META_IG_USER_ID}" --data-urlencode "fields=username" --data-urlencode "access_token=${META_ACCESS_TOKEN}" | jq -c 'del(.id)'
      - name: OpenAI tiny call
        run: |
          set +x
          code=$(curl -sS -o /tmp/o.json -w '%{http_code}' https://api.openai.com/v1/responses \
            -H "Authorization: Bearer ${OPENAI_API_KEY}" -H "Content-Type: application/json" \
            -d "$(jq -n --arg m "$OPENAI_MODEL" '{model:$m,input:"Reply with the single word: ok",max_output_tokens:16}')")
          echo "OpenAI HTTP $code model=$OPENAI_MODEL"
          jq -r '.error.message // ([.output[]? | select(.type=="message") | .content[]?.text] | join(""))' /tmp/o.json | head -3
