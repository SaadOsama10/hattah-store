name: Social — collect the daily OpenAI batch

on:
  workflow_dispatch:
    inputs:
      force_fallback:
        description: "Cancel the batch now and generate the remaining posts with normal API calls"
        required: false
        default: false
        type: boolean

# Same group as generation: never render two things at once.
concurrency:
  group: social-generate
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automation
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
      WHATSAPP_NUMBER: "905529987112"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('automation/package-lock.json') }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Ensure ffmpeg (bundled static build; apt only as a time-boxed fallback)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          BIN="$(node -p "require('ffmpeg-static') || ''" 2>/dev/null || true)"
          if [ -n "$BIN" ] && [ -x "$BIN" ]; then echo "ffmpeg-static: $BIN"; exit 0; fi
          command -v ffmpeg >/dev/null && exit 0
          sudo -E timeout 150 apt-get install -y -qq ffmpeg
      - name: Collect
        env:
          FORCE_FALLBACK: ${{ inputs.force_fallback && '--force-fallback' || '' }}
        run: npx tsx src/collect.ts $FORCE_FALLBACK
