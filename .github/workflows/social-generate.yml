name: Social — generate posts

on:
  schedule:
    # 00:00 UTC = 03:00 Istanbul (UTC+3). Creates today's posts.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | today | tomorrow | regenerate"
        default: "today"
        type: string
      post_id:
        description: "regenerate: social_posts.id"
        required: false
        type: string
      what:
        description: "regenerate: image | caption | both | swap"
        required: false
        default: "both"
        type: string
      extra_args:
        description: "today/daily: extra generate.ts flags, e.g. --date=2026-10-25 --only=story@10:15 --jitter=0"
        required: false
        type: string
      dry_run:
        description: "DRY_RUN (no Meta calls)"
        required: false
        default: false
        type: boolean

concurrency:
  group: social-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: automation
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL || 'gpt-6.1-sol' }}
      WHATSAPP_NUMBER: "905529987112"
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      # A manual run is explicit intent: generate even while the system is switched off.
      FORCE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('automation/package-lock.json') }}
      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi
      - name: Ensure ffmpeg (reels)
        timeout-minutes: 6
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          command -v ffmpeg >/dev/null && exit 0
          sudo -E apt-get update -qq -o Acquire::Retries=3
          sudo -E apt-get install -y -qq -o Acquire::Retries=3 -o Dpkg::Lock::Timeout=120 ffmpeg
      - name: Generate / regenerate
        env:
          IN_MODE: ${{ inputs.mode }}
          IN_POST: ${{ inputs.post_id }}
          IN_WHAT: ${{ inputs.what }}
          IN_ARGS: ${{ inputs.extra_args }}
        run: |
          MODE="${IN_MODE:-daily}"
          case "$MODE" in
            regenerate) npx tsx src/regenerate.ts --post="$IN_POST" --what="${IN_WHAT:-both}" ;;
            today)      npx tsx src/generate.ts $IN_ARGS ;;
            *)          npx tsx src/generate.ts --tomorrow ;;  # daily cron (03:00 Istanbul) + "tomorrow": the whole next day in one run
          esac
      - name: Storage cleanup (images 14 days after publishing, orphans)
        continue-on-error: true
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'tomorrow' || inputs.mode == 'daily' }}
        run: npx tsx src/cleanup.ts
