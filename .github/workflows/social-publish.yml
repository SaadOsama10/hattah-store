name: Social — publish due posts

on:
  schedule:
    # Every 15 minutes: slots carry a random ±10 min offset, so publish whatever is due, in order.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      post_id:
        description: "Publish this post now (social_posts.id); empty = all due"
        required: false
        type: string
      check_reel:
        description: "Validate this reel (social_posts.id) against Instagram WITHOUT publishing"
        required: false
        type: string
      dry_run:
        description: "DRY_RUN (no Meta calls)"
        required: false
        default: false
        type: boolean

concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: automation
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v25.0' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Publish
        env:
          IN_POST: ${{ inputs.post_id }}
          IN_CHECK: ${{ inputs.check_reel }}
        run: |
          if [ -n "$IN_CHECK" ]; then
            npx tsx src/reel-check.ts "$IN_CHECK"
          elif [ -n "$IN_POST" ]; then
            npx tsx src/publish.ts --post="$IN_POST"
          else
            npx tsx src/publish.ts
          fi
